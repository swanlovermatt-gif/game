<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🦐 虾壳游戏工坊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: white; overflow: hidden; touch-action: none; }
        
        /* 主菜单 */
        #menu { padding: 20px; text-align: center; min-height: 100vh; }
        #menu h1 { font-size: 24px; margin: 20px 0; }
        #menu p { color: #aaa; margin-bottom: 30px; font-size: 14px; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 360px; margin: 0 auto; }
        .game-card { background: #2d3748; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .game-card:hover, .game-card:active { background: #4a5568; border-color: #667eea; }
        .game-icon { font-size: 32px; margin-bottom: 8px; }
        .game-title { font-size: 13px; font-weight: bold; }
        .game-type { font-size: 11px; color: #aaa; margin-top: 4px; }
        
        /* 游戏页面 */
        #game-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; }
        #game-page.active { display: block; }
        .game-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .game-header-title { font-size: 16px; font-weight: bold; }
        .back-btn { background: #f56565; color: white; border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; }
        #game-canvas { display: block; margin-top: 50px; }
        
        /* 提示 */
        #hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #aaa; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 10; }
        #score-display { position: fixed; top: 55px; left: 16px; font-size: 20px; color: #ffd700; z-index: 10; }
    </style>
</head>
<body>
    <!-- 主菜单 -->
    <div id="menu">
        <h1>🦐 虾壳游戏工坊</h1>
        <p>点击开始游戏！</p>
        <div class="games-grid">
            <div class="game-card" onclick="startGame(1)">
                <div class="game-icon">🏃</div>
                <div class="game-title">超级跑酷</div>
                <div class="game-type">点击跳跃</div>
            </div>
            <div class="game-card" onclick="startGame(2)">
                <div class="game-icon">🎯</div>
                <div class="game-title">像素射击</div>
                <div class="game-type">点击射击</div>
            </div>
            <div class="game-card" onclick="startGame(3)">
                <div class="game-icon">🧩</div>
                <div class="game-title">数字滑块</div>
                <div class="game-type">点击移动</div>
            </div>
            <div class="game-card" onclick="startGame(4)">
                <div class="game-icon">⚔️</div>
                <div class="game-title">勇者斗龙</div>
                <div class="game-type">点击按钮</div>
            </div>
            <div class="game-card" onclick="startGame(5)">
                <div class="game-icon">🏎️</div>
                <div class="game-title">极速赛车</div>
                <div class="game-type">点击切换</div>
            </div>
            <div class="game-card" onclick="startGame(6)">
                <div class="game-icon">🐦</div>
                <div class="game-title">跳跃小鸟</div>
                <div class="game-type">点击飞行</div>
            </div>
        </div>
    </div>
    
    <!-- 游戏页面 -->
    <div id="game-page">
        <div class="game-header">
            <div class="game-header-title" id="game-title">🎮 游戏</div>
            <button class="back-btn" onclick="exitGame()">返回</button>
        </div>
        <div id="score-display"></div>
        <canvas id="game-canvas"></canvas>
        <div id="hint"></div>
    </div>

<script>
// ============ 通用游戏引擎 ============
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

let currentGame = null;
let animationId = null;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 50;
}

function drawText(text, x, y, size, color, align) {
    ctx.font = size + 'px sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.fillText(text, x, y);
}

function drawRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
}

function drawCircle(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
}

// ============ 游戏1: 跑酷 ============
function startRunner() {
    const state = {
        player: { x: 80, y: 0, vy: 0, w: 35, h: 35 },
        grounds: [],
        coins: [],
        spikes: [],
        score: 0,
        gameOver: false,
        speed: 4,
        groundY: 0
    };
    
    function reset() {
        resizeCanvas();
        state.groundY = canvas.height - 30;
        state.player.y = state.groundY - state.player.h;
        state.player.vy = 0;
        state.coins = [];
        state.spikes = [];
        state.score = 0;
        state.gameOver = false;
        state.speed = 4;
        // 创建地面
        state.grounds = [];
        for (let i = 0; i < 15; i++) {
            state.grounds.push({ x: i * 100, y: state.groundY, w: 100, h: 20 });
        }
    }
    
    function update() {
        if (state.gameOver) return;
        
        // 重力
        state.player.vy += 0.5;
        state.player.y += state.player.vy;
        
        // 地面碰撞
        if (state.player.y >= state.groundY - state.player.h) {
            state.player.y = state.groundY - state.player.h;
            state.player.vy = 0;
        }
        
        // 移动地面和物体
        for (let g of state.grounds) {
            g.x -= state.speed;
            if (g.x + g.w < 0) g.x += 1500;
        }
        
        // 生成金币和障碍
        if (Math.random() < 0.02) {
            const type = Math.random();
            if (type < 0.6) {
                state.coins.push({ x: canvas.width + 20, y: state.groundY - 80 - Math.random() * 60, r: 12 });
            } else {
                state.spikes.push({ x: canvas.width + 20, y: state.groundY - 20, w: 25, h: 25 });
            }
        }
        
        // 移动金币
        for (let c of state.coins) {
            c.x -= state.speed;
        }
        state.coins = state.coins.filter(c => c.x > -30);
        
        // 移动障碍
        for (let s of state.spikes) {
            s.x -= state.speed;
        }
        state.spikes = state.spikes.filter(s => s.x > -30);
        
        // 碰撞检测 - 金币
        for (let i = state.coins.length - 1; i >= 0; i--) {
            const c = state.coins[i];
            if (Math.abs(state.player.x + state.player.w/2 - c.x) < 30 && Math.abs(state.player.y + state.player.h/2 - c.y) < 30) {
                state.coins.splice(i, 1);
                state.score += 10;
            }
        }
        
        // 碰撞检测 - 障碍
        for (let s of state.spikes) {
            if (state.player.x < s.x + s.w && state.player.x + state.player.w > s.x &&
                state.player.y < s.y + s.h && state.player.y + state.player.h > s.y) {
                state.gameOver = true;
                state.speed = 0;
            }
        }
    }
    
    function draw() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 地面
        for (let g of state.grounds) {
            drawRect(g.x, g.y, g.w, g.h, '#48bb78');
        }
        
        // 金币
        for (let c of state.coins) {
            drawCircle(c.x, c.y, c.r, '#ffd700');
        }
        
        // 障碍
        for (let s of state.spikes) {
            drawRect(s.x, s.y, s.w, s.h, '#f56565');
        }
        
        // 玩家
        drawRect(state.player.x, state.player.y, state.player.w, state.player.h, '#667eea');
        
        // 分数
        document.getElementById('score-display').textContent = '分数: ' + state.score;
        
        if (state.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawText('游戏结束！', canvas.width/2, canvas.height/2 - 20, 28, '#fff', 'center');
            drawText('点击重新开始', canvas.width/2, canvas.height/2 + 20, 18, '#aaa', 'center');
        }
    }
    
    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }
    
    function jump() {
        if (!state.gameOver && state.player.vy === 0) {
            state.player.vy = -12;
        }
    }
    
    reset();
    document.getElementById('hint').textContent = '点击跳跃';
    
    const handler = (e) => { e.preventDefault(); jump(); };
    canvas.addEventListener('touchstart', handler, { passive: false });
    canvas.addEventListener('mousedown', handler);
    document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); jump(); } });
    
    state.canvasHandler = handler;
    loop();
    
    return {
        restart: () => {
            canvas.removeEventListener('touchstart', state.canvasHandler);
            canvas.removeEventListener('mousedown', state.canvasHandler);
            reset();
        }
    };
}

// ============ 游戏2: 射击 ============
function startShooter() {
    const state = {
        player: { x: 60, y: 0, w: 40, h: 25 },
        bullets: [],
        enemies: [],
        score: 0,
        gameOver: false,
        mouseY: 0
    };
    
    function reset() {
        resizeCanvas();
        state.player.y = canvas.height / 2;
        state.bullets = [];
        state.enemies = [];
        state.score = 0;
        state.gameOver = false;
    }
    
    function update() {
        if (state.gameOver) return;
        
        // 移动玩家
        state.player.y += (state.mouseY - state.player.y) * 0.1;
        state.player.y = Math.max(20, Math.min(canvas.height - 40, state.player.y));
        
        // 移动子弹
        for (let b of state.bullets) {
            b.x += 8;
        }
        state.bullets = state.bullets.filter(b => b.x < canvas.width + 10);
        
        // 生成敌人
        if (Math.random() < 0.025) {
            state.enemies.push({ x: canvas.width + 20, y: 40 + Math.random() * (canvas.height - 80), w: 35, h: 35, vx: -3 });
        }
        
        // 移动敌人
        for (let e of state.enemies) {
            e.x += e.vx;
        }
        state.enemies = state.enemies.filter(e => e.x > -40);
        
        // 子弹击中敌人
        for (let i = state.bullets.length - 1; i >= 0; i--) {
            for (let j = state.enemies.length - 1; j >= 0; j--) {
                const b = state.bullets[i];
                const e = state.enemies[j];
                if (b && e && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    state.bullets.splice(i, 1);
                    state.enemies.splice(j, 1);
                    state.score += 10;
                    break;
                }
            }
        }
        
        // 敌人碰到玩家
        for (let e of state.enemies) {
            if (state.player.x < e.x + e.w && state.player.x + state.player.w > e.x &&
                state.player.y < e.y + e.h && state.player.y + state.player.h > e.y) {
                state.gameOver = true;
            }
        }
    }
    
    function draw() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 玩家飞船
        ctx.fillStyle = '#667eea';
        ctx.fillRect(state.player.x, state.player.y, state.player.w, state.player.h);
        // 尾部火焰
        ctx.fillStyle = '#ff6b6b';
        ctx.fillRect(state.player.x - 10, state.player.y + 8, 12, 8);
        
        // 子弹
        ctx.fillStyle = '#ffd700';
        for (let b of state.bullets) {
            ctx.fillRect(b.x, b.y - 2, 15, 4);
        }
        
        // 敌人
        ctx.fillStyle = '#f56565';
        for (let e of state.enemies) {
            ctx.fillRect(e.x, e.y, e.w, e.h);
        }
        
        document.getElementById('score-display').textContent = '分数: ' + state.score;
        
        if (state.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawText('游戏结束！', canvas.width/2, canvas.height/2 - 20, 28, '#fff', 'center');
            drawText('点击重新开始', canvas.width/2, canvas.height/2 + 20, 18, '#aaa', 'center');
        }
    }
    
    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }
    
    function shoot() {
        if (!state.gameOver) {
            state.bullets.push({ x: state.player.x + state.player.w, y: state.player.y + state.player.h / 2 });
        }
    }
    
    reset();
    document.getElementById('hint').textContent = '移动鼠标，点击射击';
    
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        state.mouseY = e.clientY - rect.top;
    });
    
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        state.mouseY = e.touches[0].clientY - rect.top;
    }, { passive: false });
    
    const downHandler = (e) => { e.preventDefault(); shoot(); };
    canvas.addEventListener('mousedown', downHandler);
    canvas.addEventListener('touchstart', downHandler, { passive: false });
    
    state.downHandler = downHandler;
    loop();
    
    return {
        restart: () => {
            canvas.removeEventListener('mousedown', state.downHandler);
            canvas.removeEventListener('touchstart', state.downHandler);
            reset();
        }
    };
}

// ============ 游戏3: 数字滑块 ============
function startPuzzle() {
    const state = {
        tiles: [],      // {value, row, col, x, y, targetX, targetY}
        emptyIdx: 8,
        moves: 0,
        isWin: false,
        tileSize: 70,
        gridSize: 3,
        colors: ['#667eea', '#48bb78', '#ffd700', '#f56565', '#9f7aea', '#38b2ac', '#ed8936', '#e53e3e'],
        animProgress: []  // 每个tile的移动动画进度
    };
    
    function reset() {
        resizeCanvas();
        state.tiles = [];
        state.moves = 0;
        state.isWin = false;
        
        const totalW = state.gridSize * state.tileSize;
        const totalH = state.gridSize * state.tileSize;
        const startX = (canvas.width - totalW) / 2;
        const startY = (canvas.height - totalH) / 2 - 20;
        state.startX = startX;
        state.startY = startY;
        
        // 创建tiles
        for (let i = 0; i < 9; i++) {
            const row = Math.floor(i / 3);
            const col = i % 3;
            const x = startX + col * state.tileSize;
            const y = startY + row * state.tileSize;
            state.tiles.push({
                value: i < 8 ? i + 1 : 0,
                row: row, col: col,
                x: x, y: y,
                targetX: x, targetY: y
            });
        }
        state.emptyIdx = 8;
        
        // 打乱
        for (let i = 0; i < 100; i++) {
            const neighbors = getNeighbors(state.emptyIdx);
            const ni = neighbors[Math.floor(Math.random() * neighbors.length)];
            swapTiles(state.emptyIdx, ni, false);
        }
    }
    
    function getNeighbors(idx) {
        const neighbors = [];
        const row = state.tiles[idx].row;
        const col = state.tiles[idx].col;
        if (row > 0) neighbors.push(idx - 3);
        if (row < 2) neighbors.push(idx + 3);
        if (col > 0) neighbors.push(idx - 1);
        if (col < 2) neighbors.push(idx + 1);
        return neighbors;
    }
    
    function swapTiles(i, j, animate) {
        const t1 = state.tiles[i];
        const t2 = state.tiles[j];
        
        // 交换位置
        const tempRow = t1.row; const tempCol = t1.col;
        t1.row = t2.row; t1.col = t2.col;
        t2.row = tempRow; t2.col = tempCol;
        
        // 交换目标位置
        t1.targetX = state.startX + t1.col * state.tileSize;
        t1.targetY = state.startY + t1.row * state.tileSize;
        t2.targetX = state.startX + t2.col * state.tileSize;
        t2.targetY = state.startY + t2.row * state.tileSize;
        
        if (!animate) {
            t1.x = t1.targetX; t1.y = t1.targetY;
            t2.x = t2.targetX; t2.y = t2.targetY;
        }
        
        // 交换数组位置
        [state.tiles[i], state.tiles[j]] = [state.tiles[j], state.tiles[i]];
        
        // 更新空tile索引
        if (t1.value === 0) state.emptyIdx = j;
        else if (t2.value === 0) state.emptyIdx = i;
    }
    
    function checkWin() {
        for (let i = 0; i < 8; i++) {
            if (state.tiles[i].value !== i + 1) return false;
        }
        return state.tiles[8].value === 0;
    }
    
    function update() {
        // 平滑移动动画
        for (let t of state.tiles) {
            if (t.value === 0) continue;
            if (Math.abs(t.x - t.targetX) > 0.5 || Math.abs(t.y - t.targetY) > 0.5) {
                t.x += (t.targetX - t.x) * 0.3;
                t.y += (t.targetY - t.y) * 0.3;
            } else {
                t.x = t.targetX;
                t.y = t.targetY;
            }
        }
    }
    
    function draw() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 画tile
        for (let t of state.tiles) {
            if (t.value === 0) continue;
            const x = t.x + 2;
            const y = t.y + 2;
            const w = state.tileSize - 4;
            const h = state.tileSize - 4;
            
            ctx.fillStyle = state.colors[t.value - 1];
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 8);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.value, x + w/2, y + h/2);
        }
        
        document.getElementById('score-display').textContent = '步数: ' + state.moves;
        
        if (state.isWin) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 32px sans-serif';
            ctx.fillStyle = '#ffd700';
            ctx.textAlign = 'center';
            ctx.fillText('🎉 恭喜通关！', canvas.width/2, canvas.height/2 - 20);
            ctx.font = '18px sans-serif';
            ctx.fillStyle = '#fff';
            ctx.fillText('步数: ' + state.moves + '  点击重新开始', canvas.width/2, canvas.height/2 + 20);
        }
    }
    
    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }
    
    function handleClick(e) {
        if (state.isWin) {
            reset();
            return;
        }
        
        const rect = canvas.getBoundingClientRect();
        const clickX = (e.clientX || e.touches[0].clientX) - rect.left;
        const clickY = (e.clientY || e.touches[0].clientY) - rect.top;
        
        for (let i = 0; i < state.tiles.length; i++) {
            const t = state.tiles[i];
            if (t.value === 0) continue;
            if (clickX >= t.x && clickX <= t.x + state.tileSize &&
                clickY >= t.y && clickY <= t.y + state.tileSize) {
                
                // 检查是否和empty相邻
                const neighbors = getNeighbors(i);
                if (neighbors.includes(state.emptyIdx)) {
                    swapTiles(i, state.emptyIdx, true);
                    state.moves++;
                    
                    if (checkWin()) {
                        state.isWin = true;
                    }
                }
                break;
            }
        }
    }
    
    reset();
    document.getElementById('hint').textContent = '点击数字移到空白处';
    
    canvas.addEventListener('click', handleClick);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); }, { passive: false });
    
    state.clickHandler = handleClick;
    loop();
    
    return {
        restart: () => {
            canvas.removeEventListener('click', state.clickHandler);
            canvas.removeEventListener('touchstart', state.clickHandler);
            reset();
        }
    };
}

// ============ 游戏4: RPG战斗 ============
function startRPG() {
    const state = {
        heroHP: 100, heroMaxHP: 100,
        dragonHP: 150, dragonMaxHP: 150,
        isHeroTurn: true,
        gameOver: false,
        log: '轮到你行动了！',
        logTimer: 0
    };
    
    let buttons = [];
    
    function reset() {
        resizeCanvas();
        state.heroHP = 100; state.heroMaxHP = 100;
        state.dragonHP = 150; state.dragonMaxHP = 150;
        state.isHeroTurn = true;
        state.gameOver = false;
        state.log = '轮到你行动了！';
        state.logTimer = 0;
        
        const bw = 110, bh = 45;
        const cx = canvas.width / 2;
        const by = canvas.height - 130;
        buttons = [
            { x: cx - 60, y: by, w: bw, h: bh, text: '⚔️ 攻击', color: '#f56565', action: 'attack' },
            { x: cx + 60, y: by, w: bw, h: bh, text: '💚 治疗', color: '#48bb78', action: 'heal' }
        ];
    }
    
    function update() {
        if (state.logTimer > 0) state.logTimer--;
    }
    
    function draw() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2 - 60;
        
        // 背景装饰
        ctx.fillStyle = '#16213e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 分割线
        ctx.fillStyle = '#333';
        ctx.fillRect(cx - 2, 80, 4, canvas.height - 200);
        
        // 英雄
        ctx.fillStyle = '#667eea';
        ctx.beginPath();
        ctx.arc(100, cy, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('勇者', 100, cy + 65);
        
        // HP条背景
        ctx.fillStyle = '#333';
        ctx.fillRect(50, cy + 80, 104, 16);
        // HP条
        ctx.fillStyle = '#48bb78';
        ctx.fillRect(52, cy + 82, (state.heroHP / state.heroMaxHP) * 100, 12);
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.fillText(state.heroHP + '/' + state.heroMaxHP, 102, cy + 93);
        
        // 龙
        ctx.fillStyle = '#f56565';
        ctx.beginPath();
        ctx.arc(canvas.width - 100, cy, 50, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('恶龙', canvas.width - 100, cy + 70);
        
        // 龙HP条背景
        ctx.fillStyle = '#333';
        ctx.fillRect(canvas.width - 152, cy + 80, 104, 16);
        // 龙HP条
        ctx.fillStyle = '#f56565';
        ctx.fillRect(canvas.width - 150, cy + 82, (state.dragonHP / state.dragonMaxHP) * 100, 12);
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.fillText(state.dragonHP + '/' + state.dragonMaxHP, canvas.width - 100, cy + 93);
        
        // 战斗日志
        ctx.fillStyle = '#ffd700';
        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(state.log, cx, 60);
        
        // 按钮
        for (let btn of buttons) {
            ctx.fillStyle = btn.color;
            ctx.beginPath();
            ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 10);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(btn.text, btn.x + btn.w/2, btn.y + btn.h/2);
        }
        
        document.getElementById('score-display').textContent = '';
        
        if (state.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = state.heroHP > 0 ? '#ffd700' : '#f56565';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(state.heroHP > 0 ? '🎉 胜利！' : '💀 失败！', cx, canvas.height/2 - 20);
            ctx.fillStyle = '#aaa';
            ctx.font = '16px sans-serif';
            ctx.fillText('点击重新开始', cx, canvas.height/2 + 20);
        }
    }
    
    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }
    
    function handleClick(e) {
        if (state.gameOver) {
            reset();
            return;
        }
        if (!state.isHeroTurn) return;
        
        const rect = canvas.getBoundingClientRect();
        const clickX = (e.clientX || e.touches[0].clientX) - rect.left;
        const clickY = (e.clientY || e.touches[0].clientY) - rect.top;
        
        for (let btn of buttons) {
            if (clickX >= btn.x && clickX <= btn.x + btn.w &&
                clickY >= btn.y && clickY <= btn.y + btn.h) {
                
                if (btn.action === 'attack') {
                    const dmg = 15 + Math.floor(Math.random() * 11);
                    state.dragonHP = Math.max(0, state.dragonHP - dmg);
                    state.log = '你造成 ' + dmg + ' 点伤害！';
                    
                    if (state.dragonHP <= 0) {
                        state.gameOver = true;
                        return;
                    }
                } else if (btn.action === 'heal') {
                    const heal = 15 + Math.floor(Math.random() * 11);
                    state.heroHP = Math.min(state.heroMaxHP, state.heroHP + heal);
                    state.log = '你恢复 ' + heal + ' 点生命！';
                }
                
                state.isHeroTurn = false;
                setTimeout(() => {
                    if (state.gameOver) return;
                    const dmg = 10 + Math.floor(Math.random() * 11);
                    state.heroHP = Math.max(0, state.heroHP - dmg);
                    state.log = '恶龙造成 ' + dmg + ' 点伤害！';
                    
                    if (state.heroHP <= 0) {
                        state.gameOver = true;
                    } else {
                        setTimeout(() => {
                            state.isHeroTurn = true;
                            state.log = '轮到你行动了！';
                        }, 500);
                    }
                }, 800);
                
                break;
            }
        }
    }
    
    reset();
    document.getElementById('hint').textContent = '点击按钮攻击或治疗';
    
    canvas.addEventListener('click', handleClick);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); }, { passive: false });
    
    state.clickHandler = handleClick;
    loop();
    
    return {
        restart: () => {
            canvas.removeEventListener('click', state.clickHandler);
            canvas.removeEventListener('touchstart', state.clickHandler);
            reset();
        }
    };
}

// ============ 游戏5: 赛车 ============
function startRacing() {
    const state = {
        playerLane: 1,
        lanes: [],
        obstacles: [],
        score: 0,
        gameOver: false,
        speed: 5,
        carW: 36,
        carH: 55
    };
    
    function reset() {
        resizeCanvas();
        state.lanes = [
            canvas.width * 0.25,
            canvas.width * 0.5,
            canvas.width * 0.75
        ];
        state.playerLane = 1;
        state.obstacles = [];
        state.score = 0;
        state.gameOver = false;
        state.speed = 5;
    }
    
    function update() {
        if (state.gameOver) return;
        
        // 生成障碍
        if (Math.random() < 0.025) {
            const lane = Math.floor(Math.random() * 3);
            // 避免同车道连续
            const lastObs = state.obstacles.filter(o => o.lane === lane);
            if (lastObs.length === 0 || lastObs[lastObs.length - 1].y > 100) {
                state.obstacles.push({ lane: lane, y: -60 });
            }
        }
        
        // 移动障碍
        for (let o of state.obstacles) {
            o.y += state.speed;
        }
        state.obstacles = state.obstacles.filter(o => o.y < canvas.height + 80);
        
        // 碰撞检测
        const playerX = state.lanes[state.playerLane];
        const playerY = canvas.height - 140;
        for (let o of state.obstacles) {
            const ox = state.lanes[o.lane];
            if (Math.abs(playerX - ox) < state.carW * 0.8 && Math.abs(playerY - o.y) < state.carH * 0.8) {
                state.gameOver = true;
            }
        }
        
        // 计分
        state.score++;
    }
    
    function draw() {
        ctx.fillStyle = '#2d3436';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 道路边界
        ctx.fillStyle = '#666';
        ctx.fillRect(0, 0, 10, canvas.height);
        ctx.fillRect(canvas.width - 10, 0, 10, canvas.height);
        
        // 车道线
        ctx.fillStyle = '#48bb78';
        for (let l of state.lanes) {
            if (state.lanes.indexOf(l) === 1) continue;
            ctx.fillRect(l - 2, 0, 4, canvas.height);
        }
        
        // 虚线路面
        ctx.setLineDash([40, 30]);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(state.lanes[0] + (state.lanes[1] - state.lanes[0]) / 2, 0);
        ctx.lineTo(state.lanes[0] + (state.lanes[1] - state.lanes[0]) / 2, canvas.height);
        ctx.moveTo(state.lanes[1] + (state.lanes[2] - state.lanes[1]) / 2, 0);
        ctx.lineTo(state.lanes[1] + (state.lanes[2] - state.lanes[1]) / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // 障碍车
        ctx.fillStyle = '#f56565';
        for (let o of state.obstacles) {
            const ox = state.lanes[o.lane];
            ctx.fillRect(ox - state.carW/2, o.y - state.carH/2, state.carW, state.carH);
        }
        
        // 玩家车
        const px = state.lanes[state.playerLane];
        const py = canvas.height - 140;
        ctx.fillStyle = '#667eea';
        ctx.fillRect(px - state.carW/2, py - state.carH/2, state.carW, state.carH);
        // 车轮
        ctx.fillStyle = '#333';
        ctx.fillRect(px - state.carW/2 - 5, py - 15, 8, 20);
        ctx.fillRect(px + state.carW/2 - 3, py - 15, 8, 20);
        ctx.fillRect(px - state.carW/2 - 5, py + 10, 8, 20);
        ctx.fillRect(px + state.carW/2 - 3, py + 10, 8, 20);
        
        document.getElementById('score-display').textContent = '分数: ' + state.score;
        
        if (state.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawText('游戏结束！', canvas.width/2, canvas.height/2 - 20, 28, '#fff', 'center');
            drawText('点击重新开始', canvas.width/2, canvas.height/2 + 20, 18, '#aaa', 'center');
        }
    }
    
    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }
    
    function switchLane(dir) {
        if (state.gameOver) return;
        state.playerLane = Math.max(0, Math.min(2, state.playerLane + dir));
    }
    
    function handleClick(e) {
        if (state.gameOver) {
            reset();
            return;
        }
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX || e.touches[0].clientX;
        if (clickX < canvas.width / 2) {
            switchLane(-1);
        } else {
            switchLane(1);
        }
    }
    
    reset();
    document.getElementById('hint').textContent = '点击左/右半屏切换车道';
    
    canvas.addEventListener('click', handleClick);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); }, { passive: false });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') switchLane(-1);
        if (e.key === 'ArrowRight') switchLane(1);
    });
    
    state.clickHandler = handleClick;
    state.keyHandler = (e) => {
        if (e.key === 'ArrowLeft') switchLane(-1);
        if (e.key === 'ArrowRight') switchLane(1);
    };
    loop();
    
    return {
        restart: () => {
            canvas.removeEventListener('click', state.clickHandler);
            canvas.removeEventListener('touchstart', state.clickHandler);
            document.removeEventListener('keydown', state.keyHandler);
            reset();
        }
    };
}

// ============ 游戏6: 跳跃小鸟 ============
function startFlappy() {
    const state = {
        bird: { x: 0, y: 0, vy: 0, r: 15 },
        pipes: [],
        score: 0,
        gameOver: false,
        pipeGap: 160,
        pipeSpeed: 3,
        passedPipes: new Set()
    };
    
    function reset() {
        resizeCanvas();
        state.bird.x = 80;
        state.bird.y = canvas.height / 2;
        state.bird.vy = 0;
        state.pipes = [];
        state.score = 0;
        state.gameOver = false;
        state.passedPipes = new Set();
    }
    
    function flap() {
        if (state.gameOver) {
            reset();
            return;
        }
        state.bird.vy = -7;
    }
    
    function update() {
        if (state.gameOver) return;
        
        // 重力
        state.bird.vy += 0.35;
        state.bird.y += state.bird.vy;
        
        // 边界
        if (state.bird.y <= state.bird.r || state.bird.y >= canvas.height - state.bird.r) {
            state.gameOver = true;
            return;
        }
        
        // 生成管道
        if (state.pipes.length === 0 || state.pipes[state.pipes.length - 1].x < canvas.width - 200) {
            const gapY = 150 + Math.random() * (canvas.height - 300);
            state.pipes.push({
                x: canvas.width + 60,
                gapY: gapY,
                id: Date.now()
            });
        }
        
        // 移动管道
        for (let p of state.pipes) {
            p.x -= state.pipeSpeed;
        }
        state.pipes = state.pipes.filter(p => p.x > -70);
        
        // 计分（穿过管道）
        for (let p of state.pipes) {
            if (!state.passedPipes.has(p.id) && p.x + 30 < state.bird.x) {
                state.passedPipes.add(p.id);
                state.score++;
            }
        }
        
        // 碰撞检测
        for (let p of state.pipes) {
            const topH = p.gapY - state.pipeGap / 2;
            const bottomY = p.gapY + state.pipeGap / 2;
            const pipeW = 60;
            
            if (state.bird.x + state.bird.r > p.x && state.bird.x - state.bird.r < p.x + pipeW) {
                if (state.bird.y - state.bird.r < topH || state.bird.y + state.bird.r > bottomY) {
                    state.gameOver = true;
                    return;
                }
            }
        }
    }
    
    function draw() {
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 云朵
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        for (let i = 0; i < 5; i++) {
            const cx = (i * 200 + 50) % (canvas.width + 100) - 50;
            ctx.beginPath();
            ctx.arc(cx, 80 + i * 10, 30, 0, Math.PI * 2);
            ctx.arc(cx + 25, 75 + i * 10, 25, 0, Math.PI * 2);
            ctx.arc(cx + 50, 80 + i * 10, 30, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 地面
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
        
        // 管道
        ctx.fillStyle = '#2ecc71';
        for (let p of state.pipes) {
            const topH = p.gapY - state.pipeGap / 2;
            const bottomY = p.gapY + state.pipeGap / 2;
            const pipeW = 60;
            
            // 上管道
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(p.x, 0, pipeW, topH);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(p.x + 5, 0, pipeW - 10, topH);
            
            // 上管道底部边框
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(p.x, topH - 20, pipeW, 20);
            
            // 下管道
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(p.x, bottomY, pipeW, canvas.height - bottomY - 20);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(p.x + 5, bottomY + 10, pipeW - 10, canvas.height - bottomY - 30);
            
            // 下管道顶部边框
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(p.x, bottomY, pipeW, 20);
        }
        
        // 小鸟
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.arc(state.bird.x, state.bird.y, state.bird.r, 0, Math.PI * 2);
        ctx.fill();
        // 眼睛
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(state.bird.x + 5, state.bird.y - 3, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(state.bird.x + 7, state.bird.y - 3, 3, 0, Math.PI * 2);
        ctx.fill();
        // 嘴巴
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(state.bird.x + state.bird.r, state.bird.y);
        ctx.lineTo(state.bird.x + state.bird.r + 10, state.bird.y + 3);
        ctx.lineTo(state.bird.x + state.bird.r, state.bird.y + 6);
        ctx.fill();
        
        document.getElementById('score-display').textContent = '分数: ' + state.score;
        
        if (state.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawText('游戏结束！', canvas.width/2, canvas.height/2 - 20, 28, '#fff', 'center');
            drawText('分数: ' + state.score + '  点击重新开始', canvas.width/2, canvas.height/2 + 20, 18, '#aaa', 'center');
        }
    }
    
    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }
    
    reset();
    document.getElementById('hint').textContent = '点击屏幕或按空格键飞行';
    
    const handler = (e) => { e.preventDefault(); flap(); };
    canvas.addEventListener('mousedown', handler);
    canvas.addEventListener('touchstart', handler, { passive: false });
    document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); flap(); } });
    
    state.handler = handler;
    loop();
    
    return {
        restart: () => {
            canvas.removeEventListener('mousedown', state.handler);
            canvas.removeEventListener('touchstart', state.handler);
            reset();
        }
    };
}

// ============ 游戏启动器 ============
const gameNames = ['', '超级跑酷', '像素射击', '数字滑块', '勇者斗龙', '极速赛车', '跳跃小鸟'];
const gameStarts = [null, startRunner, startShooter, startPuzzle, startRPG, startRacing, startFlappy];

function startGame(id) {
    // 停止之前的游戏
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
    
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game-page').classList.add('active');
    document.getElementById('game-title').textContent = '🎮 ' + gameNames[id];
    document.getElementById('score-display').textContent = '';
    document.getElementById('hint').textContent = '';
    
    resizeCanvas();
    
    // 启动游戏
    if (id === 1) currentGame = startRunner();
    else if (id === 2) currentGame = startShooter();
    else if (id === 3) currentGame = startPuzzle();
    else if (id === 4) currentGame = startRPG();
    else if (id === 5) currentGame = startRacing();
    else if (id === 6) currentGame = startFlappy();
}

function exitGame() {
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
    currentGame = null;
    document.getElementById('game-page').classList.remove('active');
    document.getElementById('menu').style.display = 'block';
    document.getElementById('score-display').textContent = '';
    document.getElementById('hint').textContent = '';
}

window.addEventListener('resize', () => {
    if (currentGame && currentGame.restart) {
        // 游戏运行中，重启游戏
        if (animationId) cancelAnimationFrame(animationId);
        const gameId = gameStarts.indexOf(currentGame);
        // 重新启动当前游戏
    }
});
</script>
