<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🦐 虾壳游戏工坊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: white; overflow: hidden; touch-action: none; }
        
        /* 主菜单 */
        #menu { padding: 20px; text-align: center; min-height: 100vh; overflow-y: auto; }
        #menu h1 { font-size: 24px; margin: 20px 0; }
        #menu p { color: #aaa; margin-bottom: 30px; font-size: 14px; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 360px; margin: 0 auto; }
        .game-card { background: #2d3748; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .game-card:hover, .game-card:active { background: #4a5568; border-color: #667eea; }
        .game-icon { font-size: 32px; margin-bottom: 8px; }
        .game-title { font-size: 13px; font-weight: bold; }
        .game-type { font-size: 11px; color: #aaa; margin-top: 4px; }
        
        /* 游戏页面 */
        #game-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; }
        #game-page.active { display: block; }
        .game-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .game-header-title { font-size: 16px; font-weight: bold; }
        .back-btn { background: #f56565; color: white; border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; }
        #game-canvas { display: block; margin-top: 50px; }
        
        /* 提示 */
        #hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #aaa; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 10; }
        #score-display { position: fixed; top: 55px; left: 16px; font-size: 20px; color: #ffd700; z-index: 10; }
    </style>
</head>
<body>
    <!-- 主菜单 -->
    <div id="menu">
        <h1>🦐 虾壳游戏工坊</h1>
        <p>点击开始游戏！</p>
        <div class="games-grid">
            <div class="game-card" onclick="startGame(1)">
                <div class="game-icon">🏃</div>
                <div class="game-title">超级跑酷</div>
                <div class="game-type">点击跳跃</div>
            </div>
            <div class="game-card" onclick="startGame(2)">
                <div class="game-icon">🎯</div>
                <div class="game-title">像素射击</div>
                <div class="game-type">点击射击</div>
            </div>
            <div class="game-card" onclick="startGame(3)">
                <div class="game-icon">🧩</div>
                <div class="game-title">数字滑块</div>
                <div class="game-type">点击移动</div>
            </div>
            <div class="game-card" onclick="startGame(4)">
                <div class="game-icon">⚔️</div>
                <div class="game-title">勇者斗龙</div>
                <div class="game-type">点击按钮</div>
            </div>
            <div class="game-card" onclick="startGame(5)">
                <div class="game-icon">🏎️</div>
                <div class="game-title">极速赛车</div>
                <div class="game-type">点击切换</div>
            </div>
            <div class="game-card" onclick="startGame(6)">
                <div class="game-icon">🐦</div>
                <div class="game-title">跳跃小鸟</div>
                <div class="game-type">点击飞行</div>
            </div>
            <div class="game-card" onclick="startGame(7)">
                <div class="game-icon">🎳</div>
                <div class="game-title">滚球闯关</div>
                <div class="game-type">滑动控制</div>
            </div>
            <div class="game-card" onclick="startGame(8)">
                <div class="game-icon">🥊</div>
                <div class="game-title">热血对决</div>
                <div class="game-type">选角色对打</div>
            </div>
        </div>
    </div>
    
    <!-- 游戏页面 -->
    <div id="game-page">
        <div class="game-header">
            <div class="game-header-title" id="game-title">🎮 游戏</div>
            <button class="back-btn" onclick="exitGame()">返回</button>
        </div>
        <div id="score-display"></div>
        <canvas id="game-canvas"></canvas>
        <div id="hint"></div>
    </div>

<script>
// ============ 通用游戏引擎 ============
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

let currentGame = null;
let animationId = null;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 50;
}

function drawText(text, x, y, size, color, align) {
    ctx.font = size + 'px sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.fillText(text, x, y);
}

function drawRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
}

function drawCircle(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
}

// ============ 游戏1: 跑酷 ============
function startRunner() {
    const state = {
        player: { x: 80, y: 0, vy: 0, w: 35, h: 35 },
        obstacles: [],
        score: 0,
        gameOver: false,
        speed: 5,
        groundY: 0
    };
    
    state.groundY = canvas.height - 80;
    state.player.y = state.groundY - state.player.h;
    
    for (let i = 0; i < 5; i++) {
        state.obstacles.push({
            x: 300 + i * 200,
            w: 25 + Math.random() * 20,
            h: 30 + Math.random() * 40
        });
    }
    
    function jump() {
        if (state.player.y >= state.groundY - state.player.h - 5 && !state.gameOver) {
            state.player.vy = -15;
        }
    }
    
    canvas.onclick = jump;
    canvas.ontouchstart = (e) => { e.preventDefault(); jump(); };
    
    function update() {
        if (state.gameOver) return;
        
        state.player.vy += 0.8;
        state.player.y += state.player.vy;
        
        if (state.player.y > state.groundY - state.player.h) {
            state.player.y = state.groundY - state.player.h;
            state.player.vy = 0;
        }
        
        state.obstacles.forEach(obs => {
            obs.x -= state.speed;
            if (obs.x < -obs.w) {
                obs.x = canvas.width + Math.random() * 200;
                obs.w = 25 + Math.random() * 20;
                obs.h = 30 + Math.random() * 40;
                state.score += 10;
            }
            
            if (state.player.x + state.player.w > obs.x && 
                state.player.x < obs.x + obs.w &&
                state.player.y + state.player.h > state.groundY - obs.h) {
                state.gameOver = true;
            }
        });
        
        state.speed = 5 + state.score / 100;
    }
    
    function draw() {
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawRect(0, state.groundY, canvas.width, 80, '#228B22');
        
        ctx.fillStyle = '#FF6B6B';
        ctx.fillRect(state.player.x, state.player.y, state.player.w, state.player.h);
        drawCircle(state.player.x + 8, state.player.y + 8, 5, '#FFF');
        
        state.obstacles.forEach(obs => {
            drawRect(obs.x, state.groundY - obs.h, obs.w, obs.h, '#8B4513');
        });
        
        document.getElementById('score-display').textContent = '分数: ' + state.score;
        
        if (state.gameOver) {
            drawText('游戏结束!', canvas.width/2, canvas.height/2, 40, '#FFF', 'center');
            drawText('点击重试', canvas.width/2, canvas.height/2 + 50, 24, '#AAA', 'center');
        }
    }
    
    function loop() {
        update();
        draw();
        if (!state.gameOver) {
            animationId = requestAnimationFrame(loop);
        } else {
            canvas.onclick = () => startGame(1);
            canvas.ontouchstart = (e) => { e.preventDefault(); startGame(1); };
        }
    }
    
    document.getElementById('hint').textContent = '点击/空格跳跃';
    loop();
    return state;
}

// ============ 游戏2: 射击 ============
function startShooter() {
    const state = {
        player: { x: 0, y: 0, w: 40, h: 40 },
        enemies: [],
        bullets: [],
        score: 0,
        gameOver: false,
        lastEnemy: 0
    };
    
    state.player.x = canvas.width / 2 - state.player.w / 2;
    state.player.y = canvas.height - 80;
    
    function shoot(e) {
        if (state.gameOver) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        state.bullets.push({ x: state.player.x + 15, y: state.player.y, vy: -12 });
        state.player.x = Math.max(0, Math.min(canvas.width - state.player.w, x - state.player.w/2));
    }
    
    canvas.onclick = shoot;
    canvas.ontouchstart = (e) => { e.preventDefault(); shoot(e); };
    
    function update() {
        if (state.gameOver) return;
        
        state.bullets.forEach(b => b.y += b.vy);
        state.bullets = state.bullets.filter(b => b.y > -10);
        
        if (Date.now() - state.lastEnemy > 800) {
            state.enemies.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                w: 30,
                h: 30,
                vy: 2 + Math.random() * 2
            });
            state.lastEnemy = Date.now();
        }
        
        state.enemies.forEach(e => e.y += e.vy);
        
        state.enemies = state.enemies.filter(e => {
            if (e.y > canvas.height) {
                state.gameOver = true;
                return false;
            }
            
            for (let i = state.bullets.length - 1; i >= 0; i--) {
                const b = state.bullets[i];
                if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    state.bullets.splice(i, 1);
                    state.score += 10;
                    return false;
                }
            }
            return true;
        });
    }
    
    function draw() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawRect(state.player.x, state.player.y, state.player.w, state.player.h, '#4ECDC4');
        
        state.bullets.forEach(b => drawCircle(b.x, b.y, 5, '#FFD700'));
        state.enemies.forEach(e => drawRect(e.x, e.y, e.w, e.h, '#FF6B6B'));
        
        document.getElementById('score-display').textContent = '分数: ' + state.score;
        
        if (state.gameOver) {
            drawText('游戏结束!', canvas.width/2, canvas.height/2, 40, '#FFF', 'center');
        }
    }
    
    function loop() {
        update();
        draw();
        if (!state.gameOver) {
            animationId = requestAnimationFrame(loop);
        } else {
            canvas.onclick = () => startGame(2);
            canvas.ontouchstart = (e) => { e.preventDefault(); startGame(2); };
        }
    }
    
    document.getElementById('hint').textContent = '点击射击敌人';
    loop();
    return state;
}

// ============ 游戏3: 数字滑块 ============
function startPuzzle() {
    const size = 4;
    let tiles = [];
    let empty = { r: 3, c: 3 };
    let moves = 0;
    
    for (let i = 0; i < size * size - 1; i++) tiles.push(i + 1);
    tiles.push(0);
    
    for (let i = 0; i < 100; i++) {
        const dir = Math.floor(Math.random() * 4);
        const dr = [-1, 1, 0, 0][dir];
        const dc = [0, 0, -1, 1][dir];
        const nr = empty.r + dr, nc = empty.c + dc;
        if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
            tiles[empty.r * size + empty.c] = tiles[nr * size + nc];
            tiles[nr * size + nc] = 0;
            empty = { r: nr, c: nc };
        }
    }
    
    const tileW = Math.min(70, (canvas.width - 40) / size);
    const startX = (canvas.width - tileW * size) / 2;
    const startY = canvas.height / 2 - tileW * size / 2;
    
    function click(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        
        const c = Math.floor((x - startX) / tileW);
        const r = Math.floor((y - startY) / tileW);
        
        if (r >= 0 && r < size && c >= 0 && c < size) {
            const dr = Math.abs(r - empty.r);
            const dc = Math.abs(c - empty.c);
            if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                tiles[empty.r * size + empty.c] = tiles[r * size + c];
                tiles[r * size + c] = 0;
                empty = { r, c };
                moves++;
            }
        }
    }
    
    canvas.onclick = click;
    canvas.ontouchstart = (e) => { e.preventDefault(); click(e); };
    
    function draw() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const val = tiles[r * size + c];
                const x = startX + c * tileW;
                const y = startY + r * tileW;
                
                if (val !== 0) {
                    drawRect(x + 2, y + 2, tileW - 4, tileW - 4, '#4ECDC4');
                    drawText(val, x + tileW/2, y + tileW/2 + 8, 28, '#FFF', 'center');
                }
            }
        }
        
        document.getElementById('score-display').textContent = '步数: ' + moves;
        
        let solved = true;
        for (let i = 0; i < size * size - 1; i++) {
            if (tiles[i] !== i + 1) solved = false;
        }
        if (solved) {
            drawText('恭喜完成!', canvas.width/2, startY - 30, 32, '#FFD700', 'center');
        }
    }
    
    document.getElementById('hint').textContent = '点击数字移动';
    function loop() { draw(); animationId = requestAnimationFrame(loop); }
    loop();
    return {};
}

// ============ 游戏4: RPG ============
function startRPG() {
    const state = {
        player: { hp: 100, maxHp: 100, atk: 15, def: 5 },
        enemy: { hp: 80, maxHp: 80, atk: 12, def: 3, name: '恶龙' },
        turn: 'player',
        msg: '选择行动!',
        gameOver: false
    };
    
    const btnW = 80, btnH = 40;
    const btnY = canvas.height - 100;
    const btns = [
        { x: canvas.width/2 - 170, label: '攻击', action: 'attack' },
        { x: canvas.width/2 - 85, label: '防御', action: 'defend' },
        { x: canvas.width/2, label: '技能', action: 'skill' },
        { x: canvas.width/2 + 85, label: '回复', action: 'heal' }
    ];
    
    let defending = false;
    let skillCd = 0;
    
    function click(e) {
        if (state.gameOver || state.turn !== 'player') return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        
        btns.forEach(btn => {
            if (x > btn.x && x < btn.x + btnW && y > btnY && y < btnY + btnH) {
                playerAction(btn.action);
            }
        });
    }
    
    canvas.onclick = click;
    canvas.ontouchstart = (e) => { e.preventDefault(); click(e); };
    
    function playerAction(action) {
        defending = false;
        let dmg = 0;
        
        if (action === 'attack') {
            dmg = Math.max(1, state.player.atk - state.enemy.def + Math.floor(Math.random() * 8));
            state.enemy.hp -= dmg;
            state.msg = '造成 ' + dmg + ' 伤害!';
        } else if (action === 'defend') {
            defending = true;
            state.msg = '防御姿态!';
        } else if (action === 'skill') {
            if (skillCd <= 0) {
                dmg = state.player.atk * 2;
                state.enemy.hp -= dmg;
                skillCd = 3;
                state.msg = '必杀技! ' + dmg + ' 伤害!';
            } else {
                state.msg = '冷却中...';
                return;
            }
        } else if (action === 'heal') {
            const heal = 25;
            state.player.hp = Math.min(state.player.maxHp, state.player.hp + heal);
            state.msg = '回复 ' + heal + ' HP!';
        }
        
        if (state.enemy.hp <= 0) {
            state.msg = '胜利!';
            state.gameOver = true;
            return;
        }
        
        state.turn = 'enemy';
        setTimeout(enemyTurn, 800);
    }
    
    function enemyTurn() {
        let dmg = Math.max(1, state.enemy.atk - state.player.def + Math.floor(Math.random() * 5));
        if (defending) dmg = Math.floor(dmg / 2);
        state.player.hp -= dmg;
        state.msg = state.enemy.name + ' 攻击! ' + dmg + ' 伤害!';
        
        if (state.player.hp <= 0) {
            state.msg = '战败...';
            state.gameOver = true;
            return;
        }
        
        state.turn = 'player';
        if (skillCd > 0) skillCd--;
    }
    
    function draw() {
        ctx.fillStyle = '#2d1b4e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Player
        drawRect(50, 100, 60, 80, '#4ECDC4');
        drawText('勇者', 80, 200, 16, '#FFF', 'center');
        const pHpW = 100 * (state.player.hp / state.player.maxHp);
        drawRect(30, 220, 100, 12, '#333');
        drawRect(30, 220, pHpW, 12, '#4CAF50');
        drawText(state.player.hp + '/' + state.player.maxHp, 80, 250, 14, '#FFF', 'center');
        
        // Enemy
        drawRect(canvas.width - 110, 80, 60, 80, '#FF6B6B');
        drawText(state.enemy.name, canvas.width - 80, 180, 16, '#FFF', 'center');
        const eHpW = 100 * (Math.max(0, state.enemy.hp) / state.enemy.maxHp);
        drawRect(canvas.width - 130, 200, 100, 12, '#333');
        drawRect(canvas.width - 130, 200, eHpW, 12, '#f44336');
        
        // Buttons
        btns.forEach(btn => {
            drawRect(btn.x, btnY, btnW, btnH, '#667eea');
            drawText(btn.label, btn.x + btnW/2, btnY + 26, 14, '#FFF', 'center');
        });
        
        drawText(state.msg, canvas.width/2, canvas.height - 140, 18, '#FFD700', 'center');
        if (skillCd > 0) drawText('技能CD: ' + skillCd, canvas.width/2, canvas.height - 160, 12, '#AAA', 'center');
    }
    
    function loop() {
        draw();
        if (!state.gameOver) animationId = requestAnimationFrame(loop);
        else {
            canvas.onclick = () => startGame(4);
            canvas.ontouchstart = (e) => { e.preventDefault(); startGame(4); };
        }
    }
    
    document.getElementById('hint').textContent = '点击按钮行动';
    loop();
    return state;
}

// ============ 游戏5: 赛车 ============
function startRacing() {
    const state = {
        lane: 1,
        obstacles: [],
        score: 0,
        speed: 8,
        gameOver: false
    };
    
    const laneW = canvas.width / 3;
    
    for (let i = 0; i < 3; i++) {
        state.obstacles.push({
            lane: Math.floor(Math.random() * 3),
            y: -100 - i * 200
        });
    }
    
    function move(dir) {
        if (state.gameOver) return;
        state.lane = Math.max(0, Math.min(2, state.lane + dir));
    }
    
    canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < canvas.width / 2) move(-1);
        else move(1);
    };
    canvas.ontouchstart = (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.touches[0].clientX - rect.left;
        if (x < canvas.width / 2) move(-1);
        else move(1);
    };
    
    function update() {
        if (state.gameOver) return;
        
        state.obstacles.forEach(obs => {
            obs.y += state.speed;
            if (obs.y > canvas.height) {
                obs.y = -80;
                obs.lane = Math.floor(Math.random() * 3);
                state.score += 10;
            }
            
            if (obs.y > canvas.height - 150 && obs.y < canvas.height - 50 && obs.lane === state.lane) {
                state.gameOver = true;
            }
        });
        
        state.speed = 8 + state.score / 50;
    }
    
    function draw() {
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < 3; i++) {
            ctx.fillStyle = i === state.lane ? '#555' : '#444';
            ctx.fillRect(i * laneW + 5, 0, laneW - 10, canvas.height);
        }
        
        ctx.fillStyle = '#4ECDC4';
        ctx.fillRect(state.lane * laneW + laneW/2 - 25, canvas.height - 100, 50, 80);
        
        state.obstacles.forEach(obs => {
            drawRect(obs.lane * laneW + laneW/2 - 20, obs.y, 40, 70, '#FF6B6B');
        });
        
        document.getElementById('score-display').textContent = '分数: ' + state.score;
        
        if (state.gameOver) {
            drawText('撞车了!', canvas.width/2, canvas.height/2, 40, '#FFF', 'center');
        }
    }
    
    function loop() {
        update();
        draw();
        if (!state.gameOver) animationId = requestAnimationFrame(loop);
        else {
            canvas.onclick = () => startGame(5);
            canvas.ontouchstart = (e) => { e.preventDefault(); startGame(5); };
        }
    }
    
    document.getElementById('hint').textContent = '点击左右切换车道';
    loop();
    return state;
}

// ============ 游戏6: 跳跃小鸟 ============
function startFlappy() {
    const state = {
        bird: { x: 80, y: 200, vy: 0 },
        pipes: [],
        score: 0,
        gameOver: false
    };
    
    for (let i = 0; i < 3; i++) {
        state.pipes.push({
            x: 200 + i * 180,
            gap: 120 + Math.random() * 80
        });
    }
    
    function flap() {
        if (state.gameOver) return;
        state.bird.vy = -8;
    }
    
    canvas.onclick = flap;
    canvas.ontouchstart = (e) => { e.preventDefault(); flap(); };
    
    function update() {
        if (state.gameOver) return;
        
        state.bird.vy += 0.5;
        state.bird.y += state.bird.vy;
        
        if (state.bird.y < 0 || state.bird.y > canvas.height - 30) {
            state.gameOver = true;
        }
        
        state.pipes.forEach(pipe => {
            pipe.x -= 3;
            if (pipe.x < -50) {
                pipe.x = canvas.width + 50;
                pipe.gap = 120 + Math.random() * 80;
                state.score++;
            }
            
            const gapY = pipe.gap;
            if (state.bird.x + 30 > pipe.x && state.bird.x < pipe.x + 50) {
                if (state.bird.y < gapY || state.bird.y + 30 > gapY + 100) {
                    state.gameOver = true;
                }
            }
        });
    }
    
    function draw() {
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        state.pipes.forEach(pipe => {
            drawRect(pipe.x, 0, 50, pipe.gap, '#228B22');
            drawRect(pipe.x, pipe.gap + 100, 50, canvas.height - pipe.gap - 100, '#228B22');
        });
        
        drawCircle(state.bird.x + 15, state.bird.y + 15, 15, '#FFD700');
        
        document.getElementById('score-display').textContent = '分数: ' + state.score;
        
        if (state.gameOver) {
            drawText('游戏结束!', canvas.width/2, canvas.height/2, 40, '#FFF', 'center');
        }
    }
    
    function loop() {
        update();
        draw();
        if (!state.gameOver) animationId = requestAnimationFrame(loop);
        else {
            canvas.onclick = () => startGame(6);
            canvas.ontouchstart = (e) => { e.preventDefault(); startGame(6); };
        }
    }
    
    document.getElementById('hint').textContent = '点击飞行';
    loop();
    return state;
}

// ============ 游戏7: 滚球闯关 ============
function startRolling() {
    const state = {
        ball: { x: 0, y: 0, vx: 0, vy: 0, r: 20 },
        platforms: [],
        coins: [],
        spikes: [],
        goal: null,
        level: 1,
        score: 0,
        gameOver: false,
        won: false,
        touchStart: null
    };
    
    // 生成关卡
    function generateLevel() {
        state.platforms = [];
        state.coins = [];
        state.spikes = [];
        state.won = false;
        state.gameOver = false;
        
        const w = canvas.width;
        const h = canvas.height;
        
        // 起始平台
        state.platforms.push({ x: 30, y: h - 60, w: 100, h: 20 });
        state.ball.x = 70;
        state.ball.y = h - 60 - state.ball.r;
        state.ball.vx = 0;
        state.ball.vy = 0;
        
        // 随机生成平台路径
        let lastX = 100;
        let lastY = h - 60;
        
        for (let i = 0; i < 5 + state.level; i++) {
            const newX = lastX + 80 + Math.random() * 60;
            const newY = Math.max(100, Math.min(h - 80, lastY + (Math.random() - 0.5) * 100));
            
            state.platforms.push({
                x: newX,
                y: newY,
                w: 60 + Math.random() * 40,
                h: 15
            });
            
            // 金币
            if (Math.random() > 0.3) {
                state.coins.push({
                    x: newX + 30,
                    y: newY - 40,
                    r: 12
                });
            }
            
            // 尖刺
            if (Math.random() > 0.7 && i > 0) {
                state.spikes.push({
                    x: newX + 20,
                    y: newY - 15,
                    w: 20,
                    h: 15
                });
            }
            
            lastX = newX + 40;
            lastY = newY;
        }
        
        // 终点
        state.goal = {
            x: lastX + 60,
            y: lastY - 30,
            w: 40,
            h: 40
        };
        
        state.platforms.push({
            x: lastX + 40,
            y: lastY,
            w: 80,
            h: 20
        });
    }
    
    generateLevel();
    
    // 触摸控制
    canvas.ontouchstart = (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        state.touchStart = {
            x: touch.clientX - rect.left,
            y: touch.clientY - rect.top
        };
    };
    
    canvas.ontouchmove = (e) => {
        e.preventDefault();
        if (!state.touchStart) return;
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const dx = touch.clientX - rect.left - state.touchStart.x;
        const dy = touch.clientY - rect.top - state.touchStart.y;
        
        state.ball.vx = dx * 0.15;
        state.ball.vy = Math.min(5, dy * 0.1);
    };
    
    canvas.ontouchend = (e) => {
        state.touchStart = null;
    };
    
    // 鼠标控制（PC）
    let mouseDown = false;
    canvas.onmousedown = (e) => {
        mouseDown = true;
        const rect = canvas.getBoundingClientRect();
        state.touchStart = {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    };
    
    canvas.onmousemove = (e) => {
        if (!mouseDown || !state.touchStart) return;
        const rect = canvas.getBoundingClientRect();
        const dx = e.clientX - rect.left - state.touchStart.x;
        const dy = e.clientY - rect.top - state.touchStart.y;
        
        state.ball.vx = dx * 0.15;
        state.ball.vy = Math.min(5, dy * 0.1);
    };
    
    canvas.onmouseup = () => {
        mouseDown = false;
        state.touchStart = null;
    };
    
    function update() {
        if (state.gameOver || state.won) return;
        
        // 重力
        state.ball.vy += 0.4;
        
        // 摩擦
        state.ball.vx *= 0.98;
        
        // 移动
        state.ball.x += state.ball.vx;
        state.ball.y += state.ball.vy;
        
        // 平台碰撞
        let onGround = false;
        state.platforms.forEach(plat => {
            if (state.ball.x + state.ball.r > plat.x &&
                state.ball.x - state.ball.r < plat.x + plat.w &&
                state.ball.y + state.ball.r > plat.y &&
                state.ball.y + state.ball.r < plat.y + plat.h + 10 &&
                state.ball.vy > 0) {
                state.ball.y = plat.y - state.ball.r;
                state.ball.vy = 0;
                onGround = true;
            }
        });
        
        // 收集金币
        state.coins = state.coins.filter(coin => {
            const dx = state.ball.x - coin.x;
            const dy = state.ball.y - coin.y;
            if (Math.sqrt(dx*dx + dy*dy) < state.ball.r + coin.r) {
                state.score += 10;
                return false;
            }
            return true;
        });
        
        // 尖刺碰撞
        state.spikes.forEach(spike => {
            if (state.ball.x + state.ball.r > spike.x &&
                state.ball.x - state.ball.r < spike.x + spike.w &&
                state.ball.y + state.ball.r > spike.y &&
                state.ball.y - state.ball.r < spike.y + spike.h) {
                state.gameOver = true;
            }
        });
        
        // 到达终点
        if (state.goal &&
            state.ball.x + state.ball.r > state.goal.x &&
            state.ball.x - state.ball.r < state.goal.x + state.goal.w &&
            state.ball.y + state.ball.r > state.goal.y &&
            state.ball.y - state.ball.r < state.goal.y + state.goal.h) {
            state.won = true;
            state.score += 50;
        }
        
        // 边界检查
        if (state.ball.y > canvas.height + 50 || state.ball.x < -50) {
            state.gameOver = true;
        }
    }
    
    function draw() {
        // 背景
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 平台
        state.platforms.forEach(plat => {
            drawRect(plat.x, plat.y, plat.w, plat.h, '#4ECDC4');
        });
        
        // 金币
        state.coins.forEach(coin => {
            drawCircle(coin.x, coin.y, coin.r, '#FFD700');
        });
        
        // 尖刺
        state.spikes.forEach(spike => {
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.moveTo(spike.x, spike.y + spike.h);
            ctx.lineTo(spike.x + spike.w/2, spike.y);
            ctx.lineTo(spike.x + spike.w, spike.y + spike.h);
            ctx.fill();
        });
        
        // 终点
        if (state.goal) {
            drawRect(state.goal.x, state.goal.y, state.goal.w, state.goal.h, '#9C27B0');
            drawText('🏁', state.goal.x + 10, state.goal.y + 30, 24, '#FFF');
        }
        
        // 球
        const gradient = ctx.createRadialGradient(
            state.ball.x - 5, state.ball.y - 5, 0,
            state.ball.x, state.ball.y, state.ball.r
        );
        gradient.addColorStop(0, '#FF9A9E');
        gradient.addColorStop(1, '#FF6B6B');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(state.ball.x, state.ball.y, state.ball.r, 0, Math.PI * 2);
        ctx.fill();
        
        // UI
        document.getElementById('score-display').textContent = '关卡 ' + state.level + ' | 分数 ' + state.score;
        
        if (state.gameOver) {
            drawText('掉落了!', canvas.width/2, canvas.height/2, 36, '#FF6B6B', 'center');
            drawText('点击重试', canvas.width/2, canvas.height/2 + 40, 20, '#AAA', 'center');
        }
        
        if (state.won) {
            drawText('过关!', canvas.width/2, canvas.height/2, 36, '#4ECDC4', 'center');
            drawText('点击下一关', canvas.width/2, canvas.height/2 + 40, 20, '#AAA', 'center');
        }
    }
    
    function handleClick() {
        if (state.gameOver) {
            generateLevel();
        } else if (state.won) {
            state.level++;
            generateLevel();
        }
    }
    
    canvas.onclick = handleClick;
    
    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }
    
    document.getElementById('hint').textContent = '拖动控制小球滚动';
    loop();
    return state;
}

// ============ 游戏8: 热血对决 (拳皇风格) ============
function startFighting() {
    // 角色定义
    const characters = [
        { name: '烈焰战士', emoji: '🔥', hp: 100, atk: 18, def: 8, spd: 5, color: '#FF6B6B', special: '烈焰斩', specialDmg: 35 },
        { name: '寒冰法师', emoji: '❄️', hp: 80, atk: 22, def: 5, spd: 6, color: '#4ECDC4', special: '冰封术', specialDmg: 40 },
        { name: '雷霆战神', emoji: '⚡', hp: 90, atk: 20, def: 7, spd: 7, color: '#FFD700', special: '雷霆万钧', specialDmg: 38 },
        { name: '暗影刺客', emoji: '🗡️', hp: 70, atk: 25, def: 4, spd: 9, color: '#9C27B0', special: '暗杀', specialDmg: 50 }
    ];
    
    const state = {
        phase: 'select', // select, fighting, result
        selectedChar: 0,
        player: null,
        enemy: null,
        turn: 'player',
        msg: '',
        animTimer: 0,
        playerAnim: { x: 0, y: 0, scale: 1 },
        enemyAnim: { x: 0, y: 0, scale: 1 },
        specialCd: 0,
        round: 1,
        playerWins: 0,
        enemyWins: 0
    };
    
    function selectChar(idx) {
        state.selectedChar = idx;
    }
    
    function startFight() {
        // 玩家角色
        const pChar = characters[state.selectedChar];
        state.player = {
            name: pChar.name,
            emoji: pChar.emoji,
            hp: pChar.hp,
            maxHp: pChar.hp,
            atk: pChar.atk,
            def: pChar.def,
            spd: pChar.spd,
            color: pChar.color,
            special: pChar.special,
            specialDmg: pChar.specialDmg,
            x: 80,
            y: canvas.height / 2
        };
        
        // 随机敌人
        let enemyIdx = Math.floor(Math.random() * characters.length);
        if (enemyIdx === state.selectedChar) enemyIdx = (enemyIdx + 1) % characters.length;
        const eChar = characters[enemyIdx];
        state.enemy = {
            name: eChar.name,
            emoji: eChar.emoji,
            hp: eChar.hp,
            maxHp: eChar.hp,
            atk: eChar.atk,
            def: eChar.def,
            spd: eChar.spd,
            color: eChar.color,
            special: eChar.special,
            specialDmg: eChar.specialDmg,
            x: canvas.width - 140,
            y: canvas.height / 2
        };
        
        state.phase = 'fighting';
        state.msg = '战斗开始!';
        state.specialCd = 0;
        state.turn = 'player';
    }
    
    function playerAction(action) {
        if (state.phase !== 'fighting' || state.turn !== 'player') return;
        
        let dmg = 0;
        
        if (action === 'attack') {
            dmg = Math.max(5, state.player.atk - state.enemy.def / 2 + Math.floor(Math.random() * 10));
            state.enemy.hp -= dmg;
            state.msg = state.player.name + ' 攻击! ' + dmg + ' 伤害';
            state.enemyAnim.scale = 0.8;
        } else if (action === 'special') {
            if (state.specialCd <= 0) {
                dmg = state.player.specialDmg + Math.floor(Math.random() * 10);
                state.enemy.hp -= dmg;
                state.msg = state.player.special + '! ' + dmg + ' 伤害!';
                state.specialCd = 3;
                state.enemyAnim.scale = 0.6;
            } else {
                state.msg = '技能冷却中...';
                return;
            }
        } else if (action === 'defend') {
            state.msg = '防御姿态!';
            state.playerAnim.scale = 1.2;
        }
        
        // 检查敌人是否死亡
        if (state.enemy.hp <= 0) {
            state.enemy.hp = 0;
            state.playerWins++;
            state.msg = '你赢了这一回合!';
            setTimeout(() => {
                if (state.playerWins >= 2) {
                    state.phase = 'result';
                    state.msg = '🏆 胜利!';
                } else {
                    nextRound();
                }
            }, 1500);
            return;
        }
        
        state.turn = 'enemy';
        setTimeout(enemyTurn, 1000);
    }
    
    function enemyTurn() {
        if (state.phase !== 'fighting') return;
        
        const action = Math.random();
        let dmg = 0;
        
        if (action < 0.7) {
            // 普通攻击
            dmg = Math.max(5, state.enemy.atk - state.player.def / 2 + Math.floor(Math.random() * 8));
            state.player.hp -= dmg;
            state.msg = state.enemy.name + ' 攻击! ' + dmg + ' 伤害';
            state.playerAnim.scale = 0.8;
        } else {
            // 特殊技能
            dmg = Math.floor(state.enemy.specialDmg * 0.7) + Math.floor(Math.random() * 8);
            state.player.hp -= dmg;
            state.msg = state.enemy.special + '! ' + dmg + ' 伤害!';
            state.playerAnim.scale = 0.6;
        }
        
        // 检查玩家是否死亡
        if (state.player.hp <= 0) {
            state.player.hp = 0;
            state.enemyWins++;
            state.msg = '你输了这一回合...';
            setTimeout(() => {
                if (state.enemyWins >= 2) {
                    state.phase = 'result';
                    state.msg = '💀 战败...';
                } else {
                    nextRound();
                }
            }, 1500);
            return;
        }
        
        state.turn = 'player';
        if (state.specialCd > 0) state.specialCd--;
    }
    
    function nextRound() {
        state.round++;
        const pChar = characters[state.selectedChar];
        state.player.hp = pChar.hp;
        
        let enemyIdx = Math.floor(Math.random() * characters.length);
        if (enemyIdx === state.selectedChar) enemyIdx = (enemyIdx + 1) % characters.length;
        const eChar = characters[enemyIdx];
        state.enemy.name = eChar.name;
        state.enemy.emoji = eChar.emoji;
        state.enemy.hp = eChar.hp;
        state.enemy.maxHp = eChar.hp;
        state.enemy.atk = eChar.atk;
        state.enemy.def = eChar.def;
        state.enemy.color = eChar.color;
        state.enemy.special = eChar.special;
        state.enemy.specialDmg = eChar.specialDmg;
        
        state.msg = '第 ' + state.round + ' 回合!';
        state.specialCd = 0;
        state.turn = 'player';
    }
    
    function click(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        
        if (state.phase === 'select') {
            // 角色选择
            const charW = 80;
            const startX = canvas.width / 2 - (characters.length * charW + (characters.length - 1) * 10) / 2;
            
            characters.forEach((char, i) => {
                const cx = startX + i * (charW + 10);
                if (x > cx && x < cx + charW && y > canvas.height / 2 - 60 && y < canvas.height / 2 + 60) {
                    state.selectedChar = i;
                }
            });
            
            // 开始按钮
            const btnX = canvas.width / 2 - 60;
            const btnY = canvas.height - 120;
            if (x > btnX && x < btnX + 120 && y > btnY && y < btnY + 50) {
                startFight();
            }
        } else if (state.phase === 'fighting') {
            // 战斗按钮
            const btnW = 70;
            const btnH = 40;
            const btnY = canvas.height - 80;
            const btns = [
                { x: canvas.width / 2 - 150, action: 'attack' },
                { x: canvas.width / 2 - 75, action: 'defend' },
                { x: canvas.width / 2, action: 'special' }
            ];
            
            btns.forEach(btn => {
                if (x > btn.x && x < btn.x + btnW && y > btnY && y < btnY + btnH) {
                    playerAction(btn.action);
                }
            });
        } else if (state.phase === 'result') {
            // 重新开始
            state.phase = 'select';
            state.round = 1;
            state.playerWins = 0;
            state.enemyWins = 0;
        }
    }
    
    canvas.onclick = click;
    canvas.ontouchstart = (e) => { e.preventDefault(); click(e); };
    
    function update() {
        // 动画恢复
        state.playerAnim.scale += (1 - state.playerAnim.scale) * 0.1;
        state.enemyAnim.scale += (1 - state.enemyAnim.scale) * 0.1;
    }
    
    function draw() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        if (state.phase === 'select') {
            // 选择界面
            drawText('选择你的战士!', canvas.width / 2, 80, 28, '#FFD700', 'center');
            
            const charW = 80;
            const startX = canvas.width / 2 - (characters.length * charW + (characters.length - 1) * 10) / 2;
            
            characters.forEach((char, i) => {
                const cx = startX + i * (charW + 10);
                const cy = canvas.height / 2;
                
                ctx.fillStyle = i === state.selectedChar ? char.color : '#333';
                ctx.fillRect(cx, cy - 50, charW, 100);
                
                if (i === state.selectedChar) {
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(cx, cy - 50, charW, 100);
                }
                
                drawText(char.emoji, cx + charW / 2, cy - 10, 32, '#FFF', 'center');
                drawText(char.name, cx + charW / 2, cy + 30, 11, '#FFF', 'center');
            });
            
            // 开始按钮
            drawRect(canvas.width / 2 - 60, canvas.height - 120, 120, 50, '#667eea');
            drawText('开战!', canvas.width / 2, canvas.height - 90, 20, '#FFF', 'center');
            
            // 角色属性显示
            const selected = characters[state.selectedChar];
            drawText('HP:' + selected.hp + ' ATK:' + selected.atk + ' DEF:' + selected.def, 
                     canvas.width / 2, canvas.height - 160, 14, '#AAA', 'center');
            
        } else if (state.phase === 'fighting') {
            // 战斗界面
            // 玩境
            ctx.fillStyle = '#2d1b4e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 回合显示
            drawText('回合 ' + state.round + ' | 你 ' + state.playerWins + ' - ' + state.enemyWins + ' 敌', 
                     canvas.width / 2, 30, 16, '#AAA', 'center');
            
            // 玩家
            const ps = state.playerAnim.scale;
            ctx.fillStyle = state.player.color;
            ctx.fillRect(state.player.x - 30 * ps, state.player.y - 60 * ps, 60 * ps, 80 * ps);
            drawText(state.player.emoji, state.player.x, state.player.y - 20, 36 * ps, '#FFF', 'center');
            
            // 玩家血条
            const pHpRatio = state.player.hp / state.player.maxHp;
            drawRect(30, 60, 120, 16, '#333');
            drawRect(30, 60, 120 * pHpRatio, 16, '#4CAF50');
            drawText(state.player.hp + '/' + state.player.maxHp, 90, 90, 12, '#FFF', 'center');
            drawText(state.player.name, 90, 55, 12, state.player.color, 'center');
            
            // 敌人
            const es = state.enemyAnim.scale;
            ctx.fillStyle = state.enemy.color;
            ctx.fillRect(state.enemy.x - 30 * es, state.enemy.y - 60 * es, 60 * es, 80 * es);
            drawText(state.enemy.emoji, state.enemy.x, state.enemy.y - 20, 36 * es, '#FFF', 'center');
            
            // 敌人血条
            const eHpRatio = state.enemy.hp / state.enemy.maxHp;
            drawRect(canvas.width - 150, 60, 120, 16, '#333');
            drawRect(canvas.width - 150, 60, 120 * eHpRatio, 16, '#f44336');
            drawText(state.enemy.hp + '/' + state.enemy.maxHp, canvas.width - 90, 90, 12, '#FFF', 'center');
            drawText(state.enemy.name, canvas.width - 90, 55, 12, state.enemy.color, 'center');
            
            // 战斗按钮
            const btnW = 70;
            const btnH = 40;
            const btnY = canvas.height - 80;
            
            drawRect(canvas.width / 2 - 150, btnY, btnW, btnH, '#FF6B6B');
            drawText('攻击', canvas.width / 2 - 115, btnY + 26, 14, '#FFF', 'center');
            
            drawRect(canvas.width / 2 - 75, btnY, btnW, btnH, '#4ECDC4');
            drawText('防御', canvas.width / 2 - 40, btnY + 26, 14, '#FFF', 'center');
            
            const specialColor = state.specialCd > 0 ? '#666' : '#FFD700';
            drawRect(canvas.width / 2, btnY, btnW, btnH, specialColor);
            drawText('必杀', canvas.width / 2 + 35, btnY + 26, 14, '#FFF', 'center');
            
            if (state.specialCd > 0) {
                drawText('CD:' + state.specialCd, canvas.width / 2 + 35, btnY - 10, 12, '#AAA', 'center');
            }
            
            // 消息
            drawText(state.msg, canvas.width / 2, canvas.height - 130, 18, '#FFD700', 'center');
            
        } else if (state.phase === 'result') {
            // 结果界面
            const isWin = state.playerWins >= 2;
            
            ctx.fillStyle = isWin ? '#1a472a' : '#4a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawText(isWin ? '🏆 胜利!' : '💀 战败...', 
                     canvas.width / 2, canvas.height / 2 - 40, 48, isWin ? '#4CAF50' : '#f44336', 'center');
            drawText('点击再来一局', canvas.width / 2, canvas.height / 2 + 40, 20, '#AAA', 'center');
        }
    }
    
    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }
    
    document.getElementById('hint').textContent = '选择角色开始战斗';
    loop();
    return state;
}

// ============ 游戏启动器 ============
const gameNames = ['', '超级跑酷', '像素射击', '数字滑块', '勇者斗龙', '极速赛车', '跳跃小鸟', '滚球闯关', '热血对决'];
const gameStarts = [null, startRunner, startShooter, startPuzzle, startRPG, startRacing, startFlappy, startRolling, startFighting];

function startGame(id) {
    // 停止之前的游戏
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
    
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game-page').classList.add('active');
    document.getElementById('game-title').textContent = '🎮 ' + gameNames[id];
    document.getElementById('score-display').textContent = '';
    document.getElementById('hint').textContent = '';
    
    resizeCanvas();
    
    // 启动游戏
    if (id === 1) currentGame = startRunner();
    else if (id === 2) currentGame = startShooter();
    else if (id === 3) currentGame = startPuzzle();
    else if (id === 4) currentGame = startRPG();
    else if (id === 5) currentGame = startRacing();
    else if (id === 6) currentGame = startFlappy();
    else if (id === 7) currentGame = startRolling();
    else if (id === 8) currentGame = startFighting();
}

function exitGame() {
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
    currentGame = null;
    document.getElementById('game-page').classList.remove('active');
    document.getElementById('menu').style.display = 'block';
    document.getElementById('score-display').textContent = '';
    document.getElementById('hint').textContent = '';
}

window.addEventListener('resize', () => {
    if (currentGame && currentGame.restart) {
        if (animationId) cancelAnimationFrame(animationId);
        const gameId = gameStarts.indexOf(currentGame);
    }
});
</script>
